worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml;

  upstream api_gateway {
    server api-gateway:3000;
    keepalive 32;
  }

  upstream shell {
    server shell:5173;
  }

  upstream mf_auth {
    server mf-auth:5174;
  }

  upstream mf_scheduling {
    server mf-scheduling:5175;
  }

  upstream mf_clinical {
    server mf-clinical:5176;
  }

  upstream mf_payments {
    server mf-payments:5177;
  }

  upstream mf_reports {
    server mf-reports:5178;
  }

  server {
    listen 80;
    server_name _;

    # API gateway — proxy all API traffic
    location /api/ {
      proxy_pass         http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Microfrontend remote entries
    location /mf-auth/ {
      proxy_pass http://mf_auth/;
      proxy_set_header Host $host;
    }

    location /mf-scheduling/ {
      proxy_pass http://mf_scheduling/;
      proxy_set_header Host $host;
    }

    location /mf-clinical/ {
      proxy_pass http://mf_clinical/;
      proxy_set_header Host $host;
    }

    location /mf-payments/ {
      proxy_pass http://mf_payments/;
      proxy_set_header Host $host;
    }

    location /mf-reports/ {
      proxy_pass http://mf_reports/;
      proxy_set_header Host $host;
    }

    # Shell app — catch-all (SPA)
    location / {
      proxy_pass http://shell;
      proxy_set_header Host $host;
      # SPA fallback
      proxy_intercept_errors on;
      error_page 404 = @shell_fallback;
    }

    location @shell_fallback {
      proxy_pass http://shell;
    }
  }
}
