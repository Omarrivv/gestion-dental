{{/* Reusable K8s service + deployment template */}}
{{/* Each backend service follows this exact pattern */}}

# ─── identity-service ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: dental
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: dental/identity-service:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: dental-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: dental
spec:
  selector:
    app: identity-service
  ports:
    - port: 3001
      targetPort: 3001
---
